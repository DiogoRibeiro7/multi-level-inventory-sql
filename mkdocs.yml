site_name: Multi-Level Inventory SQL
site_description: Production-oriented PostgreSQL inventory system documentation
site_url: https://diogoribeiro7.github.io/multi-level-inventory-sql/
repo_name: DiogoRibeiro7/multi-level-inventory-sql
repo_url: https://github.com/DiogoRibeiro7/multi-level-inventory-sql
strict: true

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Database:
      - Schema Reference: SCHEMA.md
      - ER Diagram: ERD.md
  - Operations:
      - Release Guide: RELEASE.md
  - Showcase: SHOWCASE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

[project]
name = "inventory"
version = "0.4.0"
description = "Utilities for managing the multi-level inventory SQL project"
authors = [
    { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "click<8.2",
]

[project.scripts]
inventory-cli = "inventory.cli:main"

[tool.poetry.dependencies]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
sqlfluff = "^2.3"
mkdocs-material = "^9.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: quay.io/abn/pgtap:1.3.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: abatilo/actions-poetry@v2

      - name: Install PostgreSQL client and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql-16-pgtap

      - name: Install dependencies
        run: poetry install

      - name: Run migrations and seeds
        run: poetry run inventory-cli postgresql://postgres:postgres@localhost:5432/postgres

      - name: Verify migration replay is a no-op
        run: poetry run inventory-cli postgresql://postgres:postgres@localhost:5432/postgres

      - name: Verify migration history
        run: |
          test "$(psql postgresql://postgres:postgres@localhost:5432/postgres -Atc "SELECT COUNT(*) FROM inventory_script_history WHERE script_type = 'migration';")" -eq 14
          test "$(psql postgresql://postgres:postgres@localhost:5432/postgres -Atc "SELECT COUNT(*) FROM inventory_script_history WHERE script_type = 'seed';")" -eq 9

      - name: Install pgTAP extension
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE EXTENSION IF NOT EXISTS pgtap;'

      - name: Run lint
        run: poetry run sqlfluff lint db/**/*.sql

      - name: Run tests
        run: poetry run pytest -q

      - name: Run pgTAP tests
        run: pg_prove --dbname=postgresql://postgres:postgres@localhost:5432/postgres tests/pgtap/*.sql

      - name: Build documentation
        run: poetry run mkdocs build --strict

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
